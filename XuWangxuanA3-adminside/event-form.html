<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Event - Admin</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <nav class="admin-nav">
        <div class="admin-logo">Hope Foundation Admin</div>
        <ul class="admin-menu">
            <li><a href="index.html">Events</a></li>
            <li><a href="event-form.html" class="active">Add New Event</a></li>
        </ul>
    </nav>

    <div class="admin-container">
        <h1 id="formTitle">Add New Event</h1>
        
        <form id="eventForm" class="admin-form">
            <div class="form-row">
                <div class="form-group">
                    <label>Event Name *</label>
                    <input type="text" name="event_name" required>
                </div>
                <div class="form-group">
                    <label>Category *</label>
                    <select name="category_id" id="categorySelect" required>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Date & Time *</label>
                    <input type="datetime-local" name="event_date" required>
                </div>
                <div class="form-group">
                    <label>Location *</label>
                    <input type="text" name="location" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Latitude</label>
                    <input type="number" step="any" name="latitude" value="-33.8688">
                </div>
                <div class="form-group">
                    <label>Longitude</label>
                    <input type="number" step="any" name="longitude" value="151.2093">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Ticket Price ($)</label>
                    <input type="number" step="0.01" name="ticket_price" value="0">
                </div>
                <div class="form-group">
                    <label>Fundraising Goal ($) *</label>
                    <input type="number" step="0.01" name="fundraising_goal" required>
                </div>
            </div>

            <div class="form-group">
                <label>Short Description *</label>
                <textarea name="short_desc" rows="2" required></textarea>
            </div>

            <div class="form-group">
                <label>Full Description</label>
                <textarea name="full_desc" rows="5"></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Status</label>
                    <select name="status">
                        <option value="upcoming">Upcoming</option>
                        <option value="ongoing">Ongoing</option>
                        <option value="past">Past</option>
                        <option value="suspended">Suspended</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Current Funds ($)</label>
                    <input type="number" step="0.01" name="current_funds" value="0">
                </div>
            </div>

            <div id="formError" class="error-msg" style="display:none;"></div>
            <div id="formSuccess" style="display:none; background:#eafaf1; color:#27ae60; padding:1rem; border-radius:6px; margin:1rem 0;">
                Event saved successfully!
            </div>

            <div class="btn-group">
                <a href="index.html" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">Save Event</button>
            </div>
        </form>
    </div>

    <script src="js/event-form.js"></script>
</body>
</html>
