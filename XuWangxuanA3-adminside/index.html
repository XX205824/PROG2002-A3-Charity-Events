<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Event Management</title>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <nav class="admin-nav">
        <div class="admin-logo">Hope Foundation Admin</div>
        <ul class="admin-menu">
            <li><a href="index.html" class="active">Events</a></li>
            <li><a href="event-form.html">Add New Event</a></li>
        </ul>
    </nav>

    <div class="admin-container">
        <div class="admin-header">
            <h1>Event Management</h1>
            <a href="event-form.html" class="btn btn-primary">+ Add New Event</a>
        </div>

        <div id="eventTableContainer">
            <!-- Loaded dynamically -->
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal" id="deleteModal">
        <div class="modal-content">
            <h3>Confirm Delete</h3>
            <p>Are you sure you want to delete this event? This action cannot be undone.</p>
            <p id="deleteError" style="color:#c0392b; margin-top:1rem; display:none;"></p>
            <div class="btn-group" style="margin-top:1.5rem; justify-content:flex-end;">
                <button class="btn btn-secondary" onclick="closeDeleteModal()">Cancel</button>
                <button class="btn btn-danger" onclick="confirmDelete()">Delete</button>
            </div>
        </div>
    </div>

    <script src="js/admin.js"></script>
</body>
</html>
